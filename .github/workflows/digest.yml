name: Jobs Digest

on:
  schedule:
    # Yerevan is UTC+4 (no DST). 06:00 UTC = 10:00 Yerevan, 15:00 UTC = 19:00 Yerevan.
    - cron: '0 6 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    # Posting is sequential now (one message per vacancy, plus flood-limit waits).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Restore the dedup state from cache. Unique key per run + a "seen-" prefix
      # in restore-keys means each run picks up the most recent previous cache.
      # On a miss, the seen.json committed in the repo acts as the seed.
      - name: Restore seen.json
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Post digest
        run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
          PROMO_CONTACT: ${{ vars.PROMO_CONTACT }}
          POST_DELAY_MS: ${{ vars.POST_DELAY_MS }}

      # Persist the updated dedup state as a fresh cache entry (no git commit to
      # main, so it never collides with manual pushes). always(): posting is one
      # message per job and each success is written to seen.json on the spot, so
      # a run that dies partway must still persist what it already posted.
      - name: Save seen.json
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
